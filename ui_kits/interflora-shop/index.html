<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Interflora Shop" name="Interflora Shop — App kit" subtitle="Storefront · Product · Cart · Sign in" viewport="440x600" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interflora — Shop UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;}
  body{font-family:Arial,sans-serif;background:#F0EEF2;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:30px;box-sizing:border-box;}
  button{font-family:Arial,sans-serif;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../icons.jsx"></script>
<script type="text/babel" src="ShopFrame.jsx"></script>
<script type="text/babel" src="Store.jsx"></script>
<script type="text/babel" src="Product.jsx"></script>
<script type="text/babel" src="Cart.jsx"></script>
<script type="text/babel" src="SignIn.jsx"></script>
<script type="text/babel">
const { useState } = React;

const SCREEN_TITLES = {
  store:'Shop', product:'Product', cart:'Cart', signin:'Account', track:'Track', faq:'FAQ', refer:'Refer a friend', favs:'Favourites'
};

function App() {
  const C = window.IFC;
  const [screen, setScreen] = useState('store');
  const [drawer, setDrawer] = useState(false);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [cartCount, setCartCount] = useState(2);
  const navigate = id => { setScreen(id); setDrawer(false); };
  const goProduct = p => { setSelectedProduct(p); setScreen('product'); };
  const addToCart = () => { setCartCount(n=>n+1); setScreen('cart'); };
  const showAppBar = screen !== 'product' && screen !== 'signin';
  const isPlaceholder = ['track','faq','refer','favs'].includes(screen);

  const cartTrailing = (
    <button onClick={()=>navigate('cart')} style={{background:'none',border:'none',cursor:'pointer',position:'relative',display:'flex'}}>
      <MS name="shopping_cart" size={24} color={C.ink}/>
      {cartCount>0 && <span style={{position:'absolute',top:-4,right:-4,background:C.primary,color:'#fff',
        borderRadius:'50%',width:16,height:16,fontSize:10,fontWeight:700,
        display:'flex',alignItems:'center',justifyContent:'center'}}>{cartCount}</span>}
    </button>
  );

  return (
    <ShopPhone>
      {showAppBar &&
        <ShopAppBar title={SCREEN_TITLES[screen]||'Interflora'} onMenu={()=>setDrawer(true)}
          avatar={screen==='store'?'https://i.pravatar.cc/80?img=47':undefined}
          trailing={screen==='store'||screen==='cart'?cartTrailing:null}/>}

      {screen==='store' && <Store onProduct={goProduct}/>}
      {screen==='product' && <ProductDetail product={selectedProduct} onBack={()=>setScreen('store')} onAddToCart={addToCart}/>}
      {screen==='cart' && <Cart onBack={()=>setScreen('store')} onCheckout={()=>navigate('signin')}/>}
      {screen==='signin' && <SignIn onSignIn={()=>navigate('store')}/>}
      {isPlaceholder &&
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          gap:10,padding:40,textAlign:'center',background:C.paper}}>
          <MS name="help" size={48} color={C.ink4}/>
          <div style={{fontFamily:'Arial,sans-serif',fontSize:18,fontWeight:700,color:C.ink3}}>{SCREEN_TITLES[screen]}</div>
          <div style={{fontFamily:'Arial,sans-serif',fontSize:13,color:C.ink4}}>Not included in this kit sample.</div>
        </div>}

      <ShopDrawer open={drawer} active={screen==='product'?'shop':screen} onClose={()=>setDrawer(false)} onNavigate={navigate} cartCount={cartCount}/>
    </ShopPhone>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

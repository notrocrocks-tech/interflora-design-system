<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-brand);background:#fff;padding:20px 22px;}
  .lbl{margin:0 0 14px;font-size:12px;font-weight:700;color:#4F4F4F;letter-spacing:1.5px;text-transform:uppercase;}
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .sw{flex:1;height:88px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;}
  .sw b{font-size:12px;font-weight:700;}
  .sw span{font-size:11px;opacity:.9;}
</style></head>
<body>
  <p class="lbl">Interflora · Yellows &amp; Oranges</p>
  <div class="row">
    <div class="sw bg-yellow"><b>Yellow</b><span>#FEDC00</span></div>
    <div class="sw bg-mid-yellow"><b>Mid Yellow</b><span>#FFF098</span></div>
    <div class="sw bg-light-yellow"><b>Light Yellow</b><span>#FFF7CB</span></div>
  </div>
  <div class="row">
    <div class="sw bg-orange"><b>Orange</b><span>#FF842B</span></div>
    <div class="sw bg-mid-orange"><b>Mid Orange</b><span>#FF9C55</span></div>
    <div class="sw bg-peach"><b>Peach</b><span>#FECCA7</span></div>
  </div>
</body></html>

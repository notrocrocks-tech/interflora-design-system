<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-brand);background:#fff;padding:20px 22px;}
  .lbl{margin:0 0 14px;font-size:12px;font-weight:700;color:#4F4F4F;letter-spacing:1.5px;text-transform:uppercase;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:104px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;}
  .sw b{font-size:12px;font-weight:700;}
  .sw span{font-size:11px;font-weight:400;opacity:.9;}
  .bd{border:1px solid #E6E6E6;}
</style></head>
<body>
  <p class="lbl">Interflora · Purple &amp; Gold</p>
  <div class="row">
    <div class="sw bg-purple"><b>Purple</b><span>#9B00FE</span></div>
    <div class="sw bg-mid-purple"><b>Mid Purple</b><span>#C366FF</span></div>
    <div class="sw bg-lilac"><b>Lilac</b><span>#E9CBFF</span></div>
    <div class="sw bg-gold"><b>Gold</b><span>#CAAD59</span></div>
  </div>
</body></html>

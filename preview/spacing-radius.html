<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-brand);background:#fff;padding:20px 24px;}
  .lbl{margin:0 0 16px;font-size:12px;font-weight:700;color:#4F4F4F;letter-spacing:1.5px;text-transform:uppercase;}
  .row{display:flex;gap:20px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:80px;height:64px;background:#E9CBFF;border:2px solid #9B00FE;}
  .t{font-size:12px;font-weight:700;color:#000;}
  .s{font-size:11px;color:#BDBDBD;}
</style></head>
<body>
  <p class="lbl">Corner radius</p>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="t">sm · 4</div><div class="s">inputs</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="t">md · 8</div><div class="s">controls</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="t">lg · 16</div><div class="s">cards</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="t">xl · 24</div><div class="s">feature tiles</div></div>
    <div class="item"><div class="box" style="border-radius:999px;width:64px"></div><div class="t">pill</div><div class="s">buttons · chips</div></div>
  </div>
</body></html>

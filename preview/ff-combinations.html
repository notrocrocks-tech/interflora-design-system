<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-brand);background:#000;padding:20px 22px;}
  .lbl{margin:0 0 14px;font-size:12px;font-weight:700;color:#6D6D6D;letter-spacing:1.5px;text-transform:uppercase;}
  .rule{font-size:11px;color:#fff;background:#6D6D6D;border-radius:4px;padding:4px 10px;display:inline-block;margin-bottom:14px;}
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .sw{flex:1;border-radius:8px;padding:14px 12px;box-sizing:border-box;}
  .sw b{display:block;font-size:13px;font-weight:700;color:#fff;}
  .sw span{display:block;font-size:11px;color:#fff;opacity:.85;margin-top:2px;}
  .sw2{flex:1;border-radius:8px;padding:12px 10px;box-sizing:border-box;}
  .sw2 b{display:block;font-size:12px;font-weight:700;color:#fff;}
  .sw2 span{font-size:10px;color:#fff;opacity:.85;}
</style></head>
<body>
  <p class="lbl">Flying Flowers · Always white text</p>
  <div class="rule">Rule: All FF backgrounds → White text, no exceptions</div>
  <div class="row">
    <div class="sw ff-bg-cobalt"><b>Cobalt heading</b><span>#007FA3</span></div>
    <div class="sw ff-bg-jade"><b>Jade heading</b><span>#048670</span></div>
    <div class="sw ff-bg-wild-exotic"><b>Wild Exotic</b><span>#E01761</span></div>
  </div>
  <div class="row">
    <div class="sw2 ff-bg-lime"><b>Lazy Lime</b><span>#BDD245</span></div>
    <div class="sw2 ff-bg-blush"><b>Plush Blush</b><span>#F7C2CE</span></div>
    <div class="sw2 ff-bg-yellow"><b>Sharp Yellow</b><span>#FEC800</span></div>
    <div class="sw2 ff-bg-black"><b>Black</b><span>#000000</span></div>
  </div>
</body></html>

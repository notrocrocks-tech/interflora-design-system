<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-brand);background:#fff;padding:20px 22px;}
  .lbl{margin:0 0 14px;font-size:12px;font-weight:700;color:#4F4F4F;letter-spacing:1.5px;text-transform:uppercase;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:104px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;}
  .sw b{font-size:12px;font-weight:700;}
  .sw span{font-size:11px;opacity:.9;}
  .bd{border:1px solid #E6E6E6;}
</style></head>
<body>
  <p class="lbl">Interflora · Neutrals</p>
  <div class="row">
    <div class="sw bg-black"><b>Black</b><span>#000000</span></div>
    <div class="sw bg-dark-grey"><b>Dark Grey</b><span>#4F4F4F</span></div>
    <div class="sw bg-mid-grey"><b>Mid Grey</b><span>#BDBDBD</span></div>
    <div class="sw bg-light-grey bd"><b>Light Grey</b><span>#F6F6F6</span></div>
    <div class="sw bg-white bd"><b>White</b><span>#FFFFFF</span></div>
  </div>
</body></html>

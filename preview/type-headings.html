<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-brand);background:#fff;padding:22px 24px;color:#000;}
  .lbl{margin:0 0 16px;font-size:12px;font-weight:700;color:#4F4F4F;letter-spacing:1.5px;text-transform:uppercase;}
  .row{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;}
  .meta{font-size:11px;color:#BDBDBD;white-space:nowrap;margin-left:auto;}
</style></head>
<body>
  <p class="lbl">Arial · Display &amp; Headings (Bold 700)</p>
  <div class="row"><span style="font:700 56px/60px Arial;letter-spacing:-1px">Flower</span><span class="meta">Display · 56/60 · -1</span></div>
  <div class="row"><span style="font:700 40px/48px Arial;letter-spacing:-.5px">Flower</span><span class="meta">H1 · 40/48</span></div>
  <div class="row"><span style="font:700 32px/40px Arial;letter-spacing:-.25px">Same-day delivery</span><span class="meta">H2 · 32/40</span></div>
  <div class="row"><span style="font:700 24px/32px Arial">Fresh seasonal bouquets</span><span class="meta">H3 · 24/32</span></div>
  <div class="row"><span style="font:700 20px/28px Arial">Order before 3pm</span><span class="meta">H4 · 20/28</span></div>
</body></html>

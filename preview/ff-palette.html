<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-brand);background:#1a1a1a;padding:20px 22px;}
  .lbl{margin:0 0 14px;font-size:12px;font-weight:700;color:#BDBDBD;letter-spacing:1.5px;text-transform:uppercase;}
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .sw{flex:1;height:90px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;}
  .sw b{font-size:12px;font-weight:700;color:#fff;}
  .sw span{font-size:11px;color:#fff;opacity:.85;}
  .row2{display:flex;gap:10px;}
  .sw2{flex:1;height:56px;border-radius:8px;display:flex;flex-direction:column;justify-content:center;padding:0 10px;box-sizing:border-box;}
  .sw2 b{font-size:11px;font-weight:700;color:#fff;}
  .sw2 span{font-size:10px;color:#fff;opacity:.85;}
</style></head>
<body>
  <p class="lbl">Flying Flowers · Palette</p>
  <div class="row">
    <div class="sw ff-bg-lime"><b>Lazy Lime</b><span>#BDD245</span></div>
    <div class="sw ff-bg-blush"><b>Plush Blush</b><span>#F7C2CE</span></div>
    <div class="sw ff-bg-yellow"><b>Sharp Yellow</b><span>#FEC800</span></div>
  </div>
  <div class="row2">
    <div class="sw2 ff-bg-cobalt"><b>Cobalt</b><span>#007FA3</span></div>
    <div class="sw2 ff-bg-jade"><b>Jade</b><span>#048670</span></div>
    <div class="sw2 ff-bg-wild-exotic"><b>Wild Exotic</b><span>#E01761</span></div>
    <div class="sw2 ff-bg-black"><b>Black</b><span>#000000</span></div>
  </div>
</body></html>
